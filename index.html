<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encra</title>
<meta name="description" content="Encra — flashcards, quiz et révisions. Flashcards, quizzes and study planner.">
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6c6c70; --line: #d1d1d6; --todo-bg: #fff4c2; --todo-line: #c9a400; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --muted: #a1a1a6; --line: #38383a; --todo-bg: #3d3300; --todo-line: #e6c300; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  nav strong { color: var(--text); font-size: 16px; margin-right: auto; }
  a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  nav a[aria-current] { color: var(--text); font-weight: 600; text-decoration: none; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 36px 0 8px; }
  p, li { margin: 0 0 10px; }
  ul { padding-left: 22px; }
  .lead { color: var(--muted); margin-bottom: 20px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px 18px; margin: 16px 0; }
  .card p:last-child, .card ul:last-child { margin-bottom: 0; }
  details { background: var(--card); border-radius: 12px; padding: 12px 16px; margin: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details[open] summary { margin-bottom: 8px; }
  details p:last-child, details ul:last-child { margin-bottom: 0; }
  .todo { background: var(--todo-bg); outline: 1px dashed var(--todo-line); border-radius: 4px; padding: 0 4px; font-weight: 600; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<nav>
  <strong>Encra</strong>
</nav>

<h1>Encra</h1>
<p class="lead">Flashcards, quiz et agenda de révision. · Flashcards, quizzes and study planner.</p>

  <p lang="en"><strong>English</strong> — <a href="support-en.html">Support</a> · <a href="privacy-en.html">Privacy</a> · <a href="terms-en.html">Terms of Use</a></p>
</div>

<footer>
  Contact : <a href="mailto:support@encra.app">support@encra.app</a>
</footer>
</main>
</body>
</html>
